name: Publish

# Publishes the `ngspice-rs` crate to crates.io. See docs/port/RELEASING.md.
#
# - Pushing a tag `vX.Y.Z` runs the release gate and then publishes. The tag
#   must match `version` in Cargo.toml.
# - Running it by hand (workflow_dispatch) does a dry run unless `dry-run` is
#   unchecked, in which case it publishes the version in Cargo.toml from the
#   chosen ref.
#
# Authentication uses crates.io Trusted Publishing (OIDC), so no long-lived API
# token is stored in the repository. The publish job runs in the `crates-io`
# environment, which is where required reviewers can be added.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and verify only; do not upload to crates.io
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Read crate version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "ngspice-rs") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

      - name: Check tag matches Cargo.toml
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests and doctests
        run: cargo test --workspace --locked

      - name: Verify Rust output against committed goldens
        run: cargo xtask golden verify

      - name: Package and verify crate
        run: cargo publish --dry-run --locked --package ngspice-rs

      - name: List packaged files
        run: cargo package --list --locked --package ngspice-rs

  publish:
    name: Publish to crates.io
    needs: verify
    if: github.ref_type == 'tag' || inputs.dry-run == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/ngspice-rs/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish ngspice-rs
        run: cargo publish --locked --package ngspice-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
