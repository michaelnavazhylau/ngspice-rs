name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test workspace (${{ matrix.rust }})
    strategy:
      matrix:
        rust: [stable, '1.89.0']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # rust-toolchain.toml selects `stable` and takes precedence over the rustup
    # default set below, so without this override every matrix entry ran stable.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          if [[ "${{ matrix.rust }}" != stable ]]; then
            rustc --version | grep -q "^rustc ${{ matrix.rust }} " \
              || { echo "::error::expected rustc ${{ matrix.rust }}"; exit 1; }
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests and doctests
        run: cargo test --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
