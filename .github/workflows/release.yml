name: Release binaries

# Builds the `spice-rs` binary for each supported target and attaches the
# archives to the GitHub release for the tag, so `cargo binstall ngspice-rs`
# can download a prebuilt binary instead of compiling. See
# docs/port/RELEASING.md.
#
# Archive names and layout must match `[package.metadata.binstall]` in
# Cargo.toml:
#   ngspice-rs-<target>-v<version>.tar.gz   (.zip on Windows)
#   └── ngspice-rs-<target>-v<version>/spice-rs[.exe], README.md, licence files
#
# A tag push builds that tag. A manual run rebuilds the binaries for an
# existing tag (for example to backfill a release) and replaces its assets.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add target to the pinned toolchain
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # A tag run cannot read caches saved by another tag, so only runs
          # started by hand from main save; tag releases restore from those.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "ngspice-rs") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build spice-rs
        run: cargo build --release --locked --package ngspice-rs --bin spice-rs --target ${{ matrix.target }}

      - name: Package archive
        id: package
        shell: bash
        run: |
          name="ngspice-rs-${{ matrix.target }}-${TAG}"
          mkdir "$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/spice-rs.exe" "$name/"
            cp README.md COPYING NOTICE AUTHORS "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/spice-rs" "$name/"
            cp README.md COPYING NOTICE AUTHORS "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the binary
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          "target/${{ matrix.target }}/release/spice-rs$ext" devices

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum ngspice-rs-* > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "ngspice-rs ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
