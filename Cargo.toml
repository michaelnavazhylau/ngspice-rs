# Cargo workspace for the Rust port of ngspice.
#
# This workspace sits at the root of an ngspice source tree (a git worktree
# on `new-parsing`, branched from `rust-port`). The C sources are deliberately left
# untouched: they are the reference implementation that the port is verified
# against.  See RUST_PORT.md and docs/port/ for the design.
#
# M0/M1a started dependency-free. On `new-parsing`, spice-netlist uses winnow
# for semantic parser combinators; only the std and parser features are enabled.
# Cargo.lock records the dependency. Offline builds require it to be cached.

[workspace]
resolver = "3"
members = [
    "crates/spice-core",
    "crates/spice-netlist",
    "crates/spice-maths",
    "crates/spice-devices",
    "crates/spice-analysis",
    "crates/spice-cli",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
repository = "https://sourceforge.net/p/ngspice/ngspice/"

[workspace.dependencies]
# Token-stream combinators replace the manual semantic-parser cursor. No FFI,
# no regex dependency, and no optional ASCII/binary/SIMD/debug features.
winnow = { version = "1.0.4", default-features = false, features = ["std", "parser"] }

# Solver backends (branch `diffsol-faer`). Both are MIT licensed, so they can be
# linked from this BSD-3-Clause derivatives work; nothing here is translated from
# the LGPL KLU or from SPARSE 1.3.
#
# `diffsol` integrates `M y' = f(t, y)` implicitly: the BDF/TR-BDF2/ESDIRK34
# BDF backend is explicitly selected for bounded linear DAEs; it is not an
# implementation of ngspice trap/fixed Gear-2. Only the `faer` backend is requested
# here. Note that diffsol 0.17.1 always enables **both** `faer` and `nalgebra`
# on its `diffsol-la`/`diffsol-nl` dependencies, so `nalgebra` is in the
# dependency graph regardless of this feature list. The `suitesparse` and
# `sundials` features stay off: they need an external KLU/SUNDIALS build.
#
# `faer` supplies the production sparse/complex and dense pivoted LU in
# `spice-maths`. Its defaults (`std`, `rayon`, `sparse-linalg`) match what the
# diffsol `faer` backend already turns on, so the two agree on one feature set.
diffsol = { version = "0.17.1", default-features = false, features = ["faer"] }
faer = "0.24.4"

# Prefer `petgraph` for graph representations/traversals instead of custom
# adjacency lists, DFS, SCC or topological-sort implementations. `spice-maths`
# exposes matrix-row coupling graphs; `spice-devices` exposes circuit incidence
# graphs. These are different domains: MNA row 0 is not ground, structural
# circuit connectivity need not be a DC path, and graph connectivity alone
# does not establish solvability. Analysis-specific validation remains future
# work. diffsol already brings in this same version and feature set.
petgraph = "0.8.3"

# Workspace-internal crates agree on one set of paths.
spice-core = { path = "crates/spice-core" }
spice-netlist = { path = "crates/spice-netlist" }
spice-maths = { path = "crates/spice-maths" }
spice-devices = { path = "crates/spice-devices" }
spice-analysis = { path = "crates/spice-analysis" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
