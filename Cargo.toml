# ngspice-rs: a from-scratch Rust implementation of the ngspice circuit
# simulator, published as a single crate.
#
# This package sits at the root of the Rust-only checkout and does not require
# the optional upstream C checkout. C is a read-only behavioral reference,
# queried out of process. See RUST_PORT.md and docs/port/ for current production
# limits and historical design records.
#
# The port was developed as six crates (`spice-core`, `spice-netlist`,
# `spice-maths`, `spice-devices`, `spice-analysis`, `spice-cli`) and was
# consolidated into one package so that crates.io carries a single name and a
# single version. The old crate boundaries survive as the module tree under
# `src/`: `primitives`, `netlist`, `maths`, `devices`, `analysis` and `cli`, in
# dependency order. Keep that layering intact in the source layout even though
# the compiler can no longer enforce it.
#
# M0/M1a started dependency-free. Semantic parsing now uses winnow; production
# linear algebra/BDF use faer/diffsol, and topology uses petgraph. Cargo.lock
# pins the graph, whose MSRV is 1.89. Offline builds require cached dependencies.

[package]
name = "ngspice-rs"
description = "A from-scratch Rust implementation of the ngspice circuit simulator: deck parsing, MNA assembly and DC/AC/transient analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["spice", "circuit-simulation", "eda", "simulator", "netlist"]
categories = ["simulation", "science", "command-line-utilities"]
# The published crate carries the library, the `spice-rs` binary, the examples
# and the licence/attribution files. The conformance fixtures and goldens
# (~18 MB), integration tests and design docs stay in the repository: nothing
# under `src/` embeds them, and `cargo package` verification only builds the
# library and binary. Release procedure: docs/port/RELEASING.md.
include = [
    "/src/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/RUST_PORT.md",
    "/COPYING",
    "/NOTICE",
    "/AUTHORS",
]

# `cargo binstall ngspice-rs` downloads the prebuilt `spice-rs` binary that
# .github/workflows/release.yml attaches to each GitHub release; the archive
# names below must match that workflow. Linux binaries are static musl builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tar.gz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-x86_64-unknown-linux-musl-v{ version }.tar.gz"
bin-dir = "{ name }-x86_64-unknown-linux-musl-v{ version }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-aarch64-unknown-linux-musl-v{ version }.tar.gz"
bin-dir = "{ name }-aarch64-unknown-linux-musl-v{ version }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.zip"
pkg-fmt = "zip"

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
repository = "https://github.com/michaelnavazhylau/ngspice-rs"

[workspace.dependencies]
# Token-stream combinators replace the manual semantic-parser cursor. No FFI,
# no regex dependency, and no optional ASCII/binary/SIMD/debug features.
winnow = { version = "1.0.4", default-features = false, features = ["std", "parser"] }

# Production solver backends. Both are MIT licensed, so they can be
# linked from this BSD-3-Clause derivatives work; nothing here is translated from
# the LGPL KLU or from SPARSE 1.3.
#
# `diffsol` offers BDF/TR-BDF2/ESDIRK34 for implicit `M y' = f(t, y)`.
# Only its BDF backend is exposed and explicitly selected for bounded linear
# DAEs; it is not an implementation of ngspice trap/fixed Gear-2. Only the `faer` backend is requested
# here. Note that diffsol 0.17.1 always enables **both** `faer` and `nalgebra`
# on its `diffsol-la`/`diffsol-nl` dependencies, so `nalgebra` is in the
# dependency graph regardless of this feature list. The `suitesparse` and
# `sundials` features stay off: they need an external KLU/SUNDIALS build.
#
# `faer` supplies the production sparse/complex and dense pivoted LU in
# `src/maths`. Its defaults (`std`, `rayon`, `sparse-linalg`) match what the
# diffsol `faer` backend already turns on, so the two agree on one feature set.
diffsol = { version = "0.17.1", default-features = false, features = ["faer"] }
faer = "0.24.4"

# Prefer `petgraph` for graph representations/traversals instead of custom
# adjacency lists, DFS, SCC or topological-sort implementations. `src/maths`
# exposes matrix-row coupling graphs; `src/devices` exposes circuit incidence
# graphs. These are different domains: MNA row 0 is not ground, structural
# circuit connectivity need not be a DC path, and graph connectivity alone
# does not establish solvability. Analysis-specific validation remains future
# work. diffsol already brings in this same version and feature set.
petgraph = "0.8.3"

[dependencies]
winnow.workspace = true
diffsol.workspace = true
faer.workspace = true
petgraph.workspace = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[lints]
workspace = true

# Unoptimized builds of the generic faer/diffsol code monomorphized into this
# crate make simulations ~25x slower, which dominated `cargo test` (the golden
# fixture verification alone took ~3 minutes). opt-level 1 keeps debug
# assertions and overflow checks; optimizing only dependencies does not help.
[profile.dev]
opt-level = 1
