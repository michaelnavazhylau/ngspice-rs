<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Spice Web</title>
    <script>
      // Bun's dev-server client (1.3.x) runs `new URL(link.href)` over every
      // <head> stylesheet link while it starts. Extensions such as Dark Reader
      // insert <link> tags with no href, so that throws `Invalid URL` and the
      // app never mounts. Until the page has loaded, an href-less link reports
      // the page URL instead, which the client ignores (it only tracks
      // /_bun/asset/ paths). No effect on links that have an href, and none
      // after DOMContentLoaded. Harmless in production builds.
      (() => {
        const proto = HTMLLinkElement.prototype;
        const native = Object.getOwnPropertyDescriptor(proto, "href");
        if (!native?.get) return;
        Object.defineProperty(proto, "href", {
          ...native,
          get() {
            return this.getAttribute("href") ? native.get.call(this) : location.href;
          },
        });
        addEventListener("DOMContentLoaded", () => Object.defineProperty(proto, "href", native), {
          once: true,
        });
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 16h6l3-8 5 16 5-16 3 8h6' fill='none' stroke='%232563eb' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
