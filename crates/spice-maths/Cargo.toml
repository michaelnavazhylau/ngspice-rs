[package]
name = "spice-maths"
description = "Matrices, sparse LU and numerical integration for the Rust ngspice port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
spice-core.workspace = true

# Numeric backends: `faer` for the sparse LU behind `sparse::SparseMatrix`, and
# `diffsol` for the implicit ODE/DAE integration that `.tran` needs. See the
# feature notes in the workspace manifest.
diffsol.workspace = true
faer.workspace = true

# Assembled matrix-row coupling topology (see `tests/mna_topology.rs`).
# This projection is neither a conductive ground-path check nor a rank test.
petgraph.workspace = true
